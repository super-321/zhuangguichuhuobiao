name: Build Old Android Project with Anko

on:
  push:
    branches: [ main, master ] # 代码推送到主分支时触发
  pull_request:
    branches: [ main, master ] # 针对PR触发
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新 Ubuntu 镜像，环境纯净

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

  # 先安装JDK 17用于Android SDK安装（如果必要）
    - name: Set up JDK 17 (关键步骤)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' 

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      # 无需单独安装SDK，Gradle会自行下载所需组件
      with:
        cmdline-tools: 'latest'  # 使用最新版本

    # 然后切换为JDK 8用于Gradle构建
    - name: Set up JDK 8 for Gradle
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Grant execute permission for Gradle Wrapper
      run: chmod +x ./gradlew # 确保Wrapper可执行

    - name: Check Java version
      run: java -version

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      # 使用 --stacktrace 便于失败时查看详细日志
      # 如果构建Release版，可改为 assembleRelease

    - name: Upload APK Artifact (可选)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk # 假设模块名为'app'，请按实际修改路径
        retention-days: 7